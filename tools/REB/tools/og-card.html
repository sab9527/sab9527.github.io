<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>重組器指引｜分享卡片</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 1200px; height: 630px; overflow: hidden;
      background: #0f0f0f; color: #fafafa;
      font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", sans-serif;
      display: grid; align-content: center; gap: 26px; padding: 74px 88px;
      position: relative;
    }
    .glow {
      position: absolute; width: 760px; height: 760px; right: -180px; top: -260px;
      background: radial-gradient(circle, rgba(62,207,142,.20), rgba(62,207,142,0) 68%);
    }
    .top { display: flex; align-items: center; gap: 18px; }
    .mark {
      width: 60px; height: 60px; border-radius: 15px; display: grid; place-items: center;
      background: #3ecf8e; color: #0f0f0f; font-size: 34px; font-weight: 800;
    }
    .brand { font-size: 26px; font-weight: 700; letter-spacing: .01em; }
    .brand small { display: block; font-size: 14px; font-weight: 400; color: #8f8f8f; letter-spacing: .12em; }
    h1 { font-size: 76px; line-height: 1.12; letter-spacing: -.02em; }
    p { font-size: 25px; color: #8f8f8f; }
    .chips { display: flex; gap: 12px; font-size: 19px; }
    .chip { padding: 7px 16px; border-radius: 9px; background: #1e1e1e; color: #cfd6d0; }
    .chip.mech { background: #1e3540; color: #a6d8ea; }
    .chip.excl { background: #4b391f; color: #e8c47f; }
    .chip.nnn { background: #4a2926; color: #f0aca2; }
    .rule { height: 3px; width: 132px; background: #3ecf8e; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="top">
    <span class="mark">R</span>
    <span class="brand">重組器指引<small>POE RECOMBINATOR GUIDE</small></span>
  </div>
  <h1>兩件底材，<br>能留下哪幾條詞綴？</h1>
  <div class="rule"></div>
  <p>輸入前綴與後綴、選好類型與存在條件，直接看機率分布與具體組合，再排素材準備路線。</p>
  <div class="chips">
    <span class="chip">原生</span>
    <span class="chip mech">機制掉落限定</span>
    <span class="chip excl">限定詞</span>
    <span class="chip nnn">非原生 NNN</span>
  </div>
</body>
</html>
